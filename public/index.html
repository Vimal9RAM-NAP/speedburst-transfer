<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPEEDBURST TRANSFER - Fast like a flash</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <link rel="stylesheet" href="style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200 flex flex-col justify-between p-6 md:p-10">

  <div class="max-w-6xl w-full mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-brand-500 animate-ping"></span>
      <span class="text-xs font-mono font-bold tracking-wider text-brand-600 dark:text-brand-400 uppercase">SYSTEM LIVE</span>
    </div>

    <div class="flex items-center gap-3">
      <a href="https://github.com" target="_blank" class="control-btn">
        GITHUB
      </a>
      <a href="#" class="control-btn">
        SITE
      </a>
      <button id="themeToggleBtn" onclick="toggleDarkMode()" class="control-btn">
        🌙
      </button>
    </div>
  </div>

  <header class="max-w-4xl w-full mx-auto text-center my-6 space-y-3">
    <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-brand-50 dark:bg-brand-900/30 border-2 border-brand-500 text-brand-600 dark:text-brand-400 mb-2 shadow-sm animate-bounce">
      ⚡
    </div>
    <h1 class="text-4xl md:text-7xl font-extrabold tracking-tight uppercase text-slate-900 dark:text-white drop-shadow-sm">
      SPEEDBURST<span class="text-brand-500">.</span>TRANSFER
    </h1>
    <div class="relative inline-block">
      <p class="text-xs md:text-sm font-mono font-bold tracking-[0.3em] text-slate-500 dark:text-slate-400 uppercase px-4 py-1 border-y-2 border-slate-200 dark:border-slate-800">
        FAST LIKE A FLASH // 24H STORAGE
      </p>
    </div>
  </header>

  <main class="max-w-5xl w-full mx-auto mb-8 flex-1 flex flex-col gap-8">
    <div 
      id="dropzone"
      class="w-full flex-1 min-h-[280px] md:min-h-[340px] border-4 border-dashed border-slate-900 dark:border-slate-200 rounded-3xl flex flex-col items-center justify-center p-8 text-center cursor-pointer hover:border-brand-500 dark:hover:border-brand-500 transition-all bg-slate-50/50 dark:bg-slate-900/40 relative group shadow-sm"
      onclick="document.getElementById('fileInput').click()"
      ondragover="handleDragOver(event)"
      ondragleave="handleDragLeave(event)"
      ondrop="handleDrop(event)"
    >
      <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
      
      <div id="dropzoneContent" class="space-y-4">
        <div class="w-16 h-16 mx-auto rounded-2xl border-2 border-slate-900 dark:border-slate-100 flex items-center justify-center text-2xl group-hover:bg-brand-500 group-hover:border-brand-500 group-hover:text-white transition-all">
          📂
        </div>
        <p class="text-2xl md:text-4xl font-extrabold tracking-wide uppercase text-slate-900 dark:text-slate-100">
          DRAG AND DROP
        </p>
        <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 max-w-xs mx-auto">
          Drop any file here to generate quick transfer access credentials instantly.
        </p>
      </div>

      <div id="fileSelectedState" class="hidden space-y-3">
        <p class="text-sm uppercase font-mono text-brand-600 dark:text-brand-400 font-bold">File Ready to Transfer</p>
        <p id="fileName" class="text-2xl font-extrabold text-slate-900 dark:text-white break-all"></p>
        <p id="fileSize" class="text-sm font-mono text-slate-500 dark:text-slate-400"></p>
        <button onclick="event.stopPropagation(); resetUpload();" class="mt-4 px-4 py-2 border-2 border-red-500 text-red-500 rounded-xl text-xs font-bold uppercase hover:bg-red-50 dark:hover:bg-red-950">
          Remove File
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <button 
        id="btnQr"
        onclick="openModal('qrModal')"
        disabled
        class="action-card"
      >
        FOR QR
      </button>

      <button 
        id="btnLink"
        onclick="openModal('linkModal')"
        disabled
        class="action-card"
      >
        FOR LINK
      </button>

      <button 
        id="btnCreds"
        onclick="openModal('credsModal')"
        disabled
        class="action-card text-center px-4"
      >
        FOR USERNAME<br>AND PASSWORD
      </button>
    </div>
  </main>

  <div id="qrModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <button onclick="closeModal('qrModal')" class="absolute top-6 left-6 text-2xl font-bold hover:text-brand-500 transition-colors">✕</button>
      
      <div id="qrContainer" class="w-64 h-64 mx-auto border-4 border-slate-900 dark:border-slate-100 rounded-2xl flex items-center justify-center p-4 bg-white"></div>

      <div class="flex items-center justify-center gap-6">
        <span class="text-xl font-extrabold uppercase tracking-widest">SCAN</span>
        <span class="text-sm font-bold text-slate-400">OR</span>
        <button onclick="shareLink()" class="px-6 py-3 border-4 border-slate-900 dark:border-slate-100 rounded-xl font-extrabold text-lg uppercase hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all flex items-center gap-2">
          SHARE ↗
        </button>
      </div>
    </div>
  </div>

  <div id="linkModal" class="modal-backdrop hidden">
    <div class="modal-box max-w-xl">
      <button onclick="closeModal('linkModal')" class="absolute top-6 left-6 text-2xl font-bold hover:text-brand-500 transition-colors">✕</button>

      <div class="pt-8">
        <input id="linkInput" type="text" readonly class="w-full p-4 border-4 border-slate-900 dark:border-slate-100 rounded-2xl font-mono text-sm md:text-base font-bold bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
      </div>

      <div class="flex items-center justify-center gap-6">
        <button onclick="copyToClipboard('linkInput')" class="px-8 py-3 border-4 border-slate-900 dark:border-slate-100 rounded-xl font-extrabold text-lg uppercase hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all">
          COPY
        </button>
        <span class="text-sm font-bold text-slate-400">OR</span>
        <button onclick="shareLink()" class="px-8 py-3 border-4 border-slate-900 dark:border-slate-100 rounded-xl font-extrabold text-lg uppercase hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all">
          SHARE ↗
        </button>
      </div>
    </div>
  </div>

  <div id="credsModal" class="modal-backdrop hidden">
    <div class="modal-box max-w-xl space-y-6">
      <button onclick="closeModal('credsModal')" class="absolute top-6 left-6 text-2xl font-bold hover:text-brand-500 transition-colors">✕</button>

      <div class="pt-8 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-2">USERNAME</label>
          <input id="usernameInput" type="text" readonly class="w-full p-4 border-4 border-slate-900 dark:border-slate-100 rounded-2xl font-mono text-base font-bold bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-2">PASSWORD</label>
          <input id="passwordInput" type="text" readonly class="w-full p-4 border-4 border-slate-900 dark:border-slate-100 rounded-2xl font-mono text-base font-bold bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none">
        </div>
      </div>

      <div class="flex items-center justify-center gap-6 pt-2">
        <button onclick="copyCreds()" class="px-8 py-3 border-4 border-slate-900 dark:border-slate-100 rounded-xl font-extrabold text-lg uppercase hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all">
          COPY
        </button>
        <span class="text-sm font-bold text-slate-400">OR</span>
        <button onclick="shareCreds()" class="px-8 py-3 border-4 border-slate-900 dark:border-slate-100 rounded-xl font-extrabold text-lg uppercase hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all">
          SHARE ↗
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
